<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de la Madre</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to top, #ffd1dc, #fff);
    }
    h1 {
      margin-top: 20px;
      color: #d63384;
    }
    img {
      max-width: 90%;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .message {
      font-size: 1.2rem;
      margin: 20px;
      color: #444;
    }
    audio {
      margin-top: 20px;
    }
    .qr {
      margin-top: 30px;
    }
    footer {
      margin: 30px 0;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>💐 ¡Feliz Día de la Madre! 💐</h1>

  <p class="message">
    Gracias por tu amor, tu fuerza y tu cariño infinito. ❤️
  </p>

  <img src="foto.jpg" alt="Foto especial">

  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <div class="qr">
    <p>Escanea para compartir 💌</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://tusitio.com" alt="QR Code">
  </div>

  <footer>
    Hecho con amor ❤️
  </footer>

</body>
</html>
